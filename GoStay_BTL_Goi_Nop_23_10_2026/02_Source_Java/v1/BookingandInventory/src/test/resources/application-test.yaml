spring:
  datasource:
    url: jdbc:h2:mem:gostay_context;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=DATE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
inventory:
  expiry:
    enabled: false

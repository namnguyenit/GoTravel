spring:
  application:
    name: CartandOrder
  config:
    import:
      - optional:classpath:database.yaml
      - optional:classpath:jwt.yaml
server:
  address: ${SERVICE_BIND_HOST:127.0.0.1}
  port: 8084
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:}
services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  communication:
    url: ${COMMUNICATION_SERVICE_URL:http://localhost:5001}
frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
